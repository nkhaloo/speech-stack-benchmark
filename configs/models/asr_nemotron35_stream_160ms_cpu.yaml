chunk_ms: 160
use_int8: true
num_threads: 4
feature_dim: 80
decoding_method: greedy_search
languages: [en, es, fr, ar, zh]
license: Apache-2.0            # sherpa-onnx runtime
weights_license: OpenMDW-1.1
gated: false
offline_after_download: true
