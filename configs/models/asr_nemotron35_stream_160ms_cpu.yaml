# CPU STREAMING ASR — Nemotron 3.5 ASR streaming 0.6B, 160 ms chunk.
#
# Identical weights to asr_nemotron35_stream_560ms_cpu.yaml, exported at a
# tighter chunk. The pair is the streaming-latency ladder for the CPU track:
# same model, same languages, same diarizer — only the encoder's lookahead
# changes, so the accuracy difference between them IS the price of lower
# latency, with nothing else varying.
#
# Expect finalization delay to fall and real-time factor to rise: a smaller
# chunk means more encoder invocations per second of audio. Check
# streaming_rtf against 1.0 before reading the latency win as free.
#
# LICENSE: OpenMDW-1.1 — see the 560 ms card.
id: nemotron35-stream-160ms-cpu
